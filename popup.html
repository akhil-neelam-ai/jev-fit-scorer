<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Worth Applying?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header class="popup-head">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Worth Applying?</h1>
    <button id="openOptions" class="link-btn" type="button">Settings</button>
  </header>

  <section class="job-score" aria-live="polite">
    <p class="eyebrow" id="jobEyebrow" hidden>This job</p>
    <h2 class="job-name" id="jobName">Reading this page…</h2>
    <p class="job-status" id="jobStatus">Finding the job description.</p>
    <div id="jobResult" hidden>
      <div class="headline">
        <p class="recommendation" id="jobRecommendation"></p>
        <span class="score-chip" id="jobScore"></span>
      </div>
      <dl class="scorecard" id="jobScorecard" hidden></dl>
      <p class="job-factor" id="jobFactor"></p>
      <dl class="scorecard visa" id="jobVisa" hidden>
        <dt>Visa sponsorship</dt>
        <dd id="jobVisaValue"></dd>
      </dl>
      <p class="job-details" id="jobDetails"></p>
    </div>
    <button id="rescore" class="btn secondary" type="button" hidden>Score again</button>
    <button id="setupGuide" class="btn" type="button" hidden>Start setup</button>
    <button id="scoreAnyway" class="btn" type="button" hidden>Score anyway</button>
    <button id="openEmbedded" class="btn" type="button" hidden>Open the posting</button>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
